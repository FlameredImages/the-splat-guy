<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#fff"/>
  <defs>
    <pattern id="weave-pat" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="8" y2="0" stroke="rgba(0,192,96,0.10)" stroke-width="1"/>
      <line x1="-2" y1="2" x2="2" y2="-2" stroke="rgba(0,192,96,0.10)" stroke-width="1"/>
      <line x1="6" y1="10" x2="10" y2="6" stroke="rgba(0,192,96,0.10)" stroke-width="1"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="rgba(0,192,96,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgba(7,10,8,0.06)" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="300" height="200" fill="url(#weave-pat)"/>
