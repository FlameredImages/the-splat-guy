<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scanomatic Labs — Business Card Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    background: #d4d4d4;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 40px;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* 85×54mm at 6px/mm = 510×324px */
  .card {
    width: 510px;
    height: 324px;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
    background-color: #ffffff;
    background-image:
      repeating-linear-gradient(-45deg, rgba(0,192,96,0.06) 0px, rgba(0,192,96,0.06) 1px, transparent 1px, transparent 8px),
      repeating-linear-gradient( 45deg, rgba(0,192,96,0.04) 0px, rgba(0,192,96,0.04) 1px, transparent 1px, transparent 8px);
    background-size: 8px 8px, 8px 8px;
  }

  /* Orange left edge */
  .edge {
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(to bottom, #FF7A00, rgba(255,122,0,0.3) 60%, transparent);
  }

  /* Point cloud SVG fills right side */
  .cloud-svg {
    position: absolute;
    top: 0; right: 0;
    width: 55%; height: 100%;
    pointer-events: none;
  }

  /* Main content */
  .inner {
    position: absolute;
    inset: 0;
    padding: 32px 36px 32px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 0.87;
  }
  .brand .line1 { display: block; font-size: 60px; color: #070A08; }
  .brand .line2 { display: block; font-size: 60px; color: #FF7A00; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: rgba(7,10,8,0.12);
  }
  .tagline {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: rgba(7,10,8,0.38);
    white-space: nowrap;
  }

  .bottom {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .name {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #070A08;
  }
  .role {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(7,10,8,0.40);
  }
  .contact {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .contact span {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.04em;
    color: rgba(7,10,8,0.45);
  }
  .contact .sep { color: rgba(7,10,8,0.18); }
  .contact .hi  { color: rgba(0,192,96,0.85); }

  /* Corner bracket */
  .corner-mark {
    position: absolute;
    bottom: 32px; left: 44px;
    width: 14px; height: 14px;
    border-left: 1px solid rgba(255,122,0,0.40);
    border-bottom: 1px solid rgba(255,122,0,0.40);
  }

  /* Crosshair registration marks */
  .reg { position:absolute; width:10px; height:10px; opacity:0.20; }
  .reg::before, .reg::after { content:''; position:absolute; background:#070A08; }
  .reg--tl { top:10px; left:10px; }
  .reg--tl::before { top:0; left:4px; width:1px; height:100%; }
  .reg--tl::after  { top:4px; left:0; width:100%; height:1px; }
  .reg--br { bottom:10px; right:10px; }
  .reg--br::before { top:0; left:4px; width:1px; height:100%; }
  .reg--br::after  { top:4px; left:0; width:100%; height:1px; }
</style>
</head>
<body>

<div class="card">
  <div class="edge"></div>

  <!-- Point cloud (generated) -->
  <svg class="cloud-svg" id="cloudSvg" viewBox="0 0 280 324" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="reg reg--tl"></div>
  <div class="reg reg--br"></div>

  <div class="inner">
    <div>
      <div class="brand">
        <span class="line1">SCANOMATIC</span>
        <span class="line2">LABS</span>
      </div>
      <div class="divider">
        <div class="divider-line"></div>
        <span class="tagline">3D Spatial Capture</span>
        <div class="divider-line" style="max-width:28px;"></div>
      </div>
    </div>
    <div class="bottom">
      <div class="name">Stephen Ryan</div>
      <div class="role">Spatial Capture Specialist</div>
      <div class="contact">
        <span>hello@scanomaticlabs.co.uk</span>
        <span class="sep">·</span>
        <span class="hi">scanomaticlabs.co.uk</span>
      </div>
    </div>
  </div>
  <div class="corner-mark"></div>
</div>

<script>
(function() {
  const svg = document.getElementById('cloudSvg');
  if (!svg) return;
  function rand(a,b) { return a + Math.random()*(b-a); }
  const dots = [];
  for (let i=0; i<80; i++)
    dots.push({x:rand(20,280), y:rand(0,200), r:rand(0.5,2.0), o:rand(0.04,0.22), g:true});
  for (let i=0; i<40; i++)
    dots.push({x:rand(60,280), y:rand(160,324), r:rand(0.4,1.4), o:rand(0.02,0.12), g:false});
  for (let i=0; i<12; i++)
    dots.push({x:rand(80,260), y:rand(10,160), r:rand(1.8,3.0), o:rand(0.30,0.55), g:true});
  const orange = [];
  for (let i=0; i<6; i++)
    orange.push({x:rand(100,260), y:rand(8,130), r:rand(1.5,2.2), o:rand(0.20,0.40)});
  svg.innerHTML =
    dots.map(d=>`<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="${d.r.toFixed(2)}" fill="rgba(${d.g?'0,192,96':'7,10,8'},${d.o.toFixed(3)})"/>`).join('')+
    orange.map(d=>`<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="${d.r.toFixed(2)}" fill="rgba(255,122,0,${d.o.toFixed(3)})"/>`).join('');
})();
</script>

</body>
</html>
