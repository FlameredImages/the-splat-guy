<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scanomatic Labs — Email Signature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fg:       #070A08;
    --fg-mid:   rgba(7,10,8,0.55);
    --fg-dim:   rgba(7,10,8,0.28);
    --green:    #00C060;
    --green-web:#00E87A;
    --orange:   #E87A00;
    --border:   rgba(7,10,8,0.12);
    --border-md:rgba(7,10,8,0.22);
    --mono:     'Space Mono', monospace;
    --sans:     'Space Grotesk', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #d4d4d4;
    padding: 32px;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .sig-outer {
    width: 540px;
    background: #fff;
    font-family: var(--sans);
  }
  .sig-top-bar {
    height: 2px;
    background: linear-gradient(to right, var(--green-web), var(--orange), transparent);
  }
  .sig-inner {
    display: grid;
    grid-template-columns: 180px 1px 1fr;
    gap: 0;
    padding: 16px 0 16px 0;
  }
  .sig-left {
    padding: 0 20px 0 16px;
  }
  .sig-mark-wrap {
    margin-bottom: 8px;
  }
  .sig-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--fg);
    margin-bottom: 1px;
  }
  .sig-company {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--fg);
    margin-bottom: 1px;
  }
  .sig-company em { font-style: normal; color: var(--orange); }
  .sig-role {
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--fg-mid);
    margin-bottom: 12px;
  }
  .sig-divider-v {
    background: var(--border-md);
    align-self: stretch;
  }
  .sig-right {
    padding: 0 16px 0 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .sig-contact-row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 5px;
  }
  .sig-clabel {
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: 1.5px;
    color: var(--green);
    text-transform: uppercase;
    width: 30px;
    flex-shrink: 0;
  }
  .sig-cval {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--fg);
  }
  .sig-cval a { color: var(--fg); text-decoration: none; }
  .sig-services {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: 1.5px;
    color: var(--fg-dim);
    text-transform: uppercase;
    line-height: 1.9;
  }
  .sig-tagline {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 7px;
    letter-spacing: 3px;
    color: var(--fg-dim);
    text-transform: uppercase;
  }
  .sig-tagline em { font-style: normal; color: var(--green); }
</style>
</head>
<body>
